<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 414" width="320" height="414" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--c5:#e7eef6">
<title id="title">Inline task input and output</title>
<desc id="desc">Prepare a filtered child input, invoke the child graph, filter its report and allowed state changes, then update the parent with a Command and ToolMessage. This is inline delegation, not a background run.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="16" width="280" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="48" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Prepare child input</text>
<text x="160" y="74" text-anchor="middle" fill="var(--muted)" font-size="18">Filtered task input</text>
<line x1="160" y1="92" x2="160" y2="118" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="118" width="280" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="150" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Run child graph</text>
<text x="160" y="176" text-anchor="middle" fill="var(--muted)" font-size="18">Own model / tool loop</text>
<line x1="160" y1="194" x2="160" y2="220" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="220" width="280" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="252" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Filter child output</text>
<text x="160" y="278" text-anchor="middle" fill="var(--muted)" font-size="18">Report · allowed changes</text>
<line x1="160" y1="296" x2="160" y2="322" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="322" width="280" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="354" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Update parent</text>
<text x="160" y="380" text-anchor="middle" fill="var(--muted)" font-size="18">Command + ToolMessage</text>
</g></svg>
