<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--surface:#fff;--accent:#40b4e5;--c5:#e7eef6" viewBox="0 0 660 630" width="660" height="630">
<title id="title">Construction happens before execution</title><desc id="desc">Model and backend resolution prepares main and child middleware stacks. LangChain create_agent builds a graph, returned for later invocation.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="40" y="25" width="580" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="69" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="700">Resolve configuration</text>
<text x="330" y="107" text-anchor="middle" fill="var(--muted)" font-size="23">Model · profile · backend</text>
<line x1="330" y1="135" x2="330" y2="180" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="180" width="580" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="224" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="700">Prepare agent stacks</text>
<text x="330" y="262" text-anchor="middle" fill="var(--muted)" font-size="23">Prompts · tools · middleware</text>
<line x1="330" y1="290" x2="330" y2="335" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="335" width="580" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="379" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="700">Build the graph</text>
<text x="330" y="417" text-anchor="middle" fill="var(--muted)" font-size="23">LangChain create_agent</text>
<line x1="330" y1="445" x2="330" y2="490" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="490" width="580" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="534" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="700">Return runnable</text>
<text x="330" y="572" text-anchor="middle" fill="var(--muted)" font-size="23">Invoke or stream later</text>
</g></svg>
