<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 546" width="320" height="546" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--c5:#e7eef6">
<title id="title">Controlled tool execution loop</title>
<desc id="desc">Inside the agent graph and harness boundary, a model proposes a call, harness controls prepare or gate it, and an allowed tool executes it. The tool exchanges calls and results with a backend outside this conceptual boundary. The left return arrow carries the tool result to the next model decision. Controls do not sandbox arbitrary tools.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<rect x="8" y="16" width="304" height="414" fill="none" stroke="var(--border)" stroke-width="1.5"/>
<g font-family="Arial, sans-serif">
<text x="160" y="45" text-anchor="middle" fill="var(--fg)" font-size="18" font-weight="700">Agent graph + harness</text>
<rect x="52" y="64" width="248" height="88" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="176" y="99" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Model decision</text>
<text x="176" y="127" text-anchor="middle" fill="var(--muted)" font-size="18">Propose tool call</text>
<line x1="176" y1="152" x2="176" y2="190" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="190" width="248" height="88" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="176" y="225" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Harness controls</text>
<text x="176" y="253" text-anchor="middle" fill="var(--muted)" font-size="18">Prepare / gate call</text>
<line x1="176" y1="278" x2="176" y2="316" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="316" width="248" height="88" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="176" y="351" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Allowed tool</text>
<text x="176" y="379" text-anchor="middle" fill="var(--muted)" font-size="18">Run permitted call</text>
<path class="flow secondary" d="M52 360 H28 V108 H52" fill="none" stroke="var(--muted)" stroke-width="1.5" opacity="0.55" marker-end="url(#arrow)"/>
<line x1="176" y1="404" x2="176" y2="442" stroke="var(--border)" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="52" y="442" width="248" height="88" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="176" y="477" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Backend / API</text>
<text x="176" y="505" text-anchor="middle" fill="var(--muted)" font-size="18">Actual effects</text>
</g></svg>
