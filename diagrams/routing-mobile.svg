<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 342" width="320" height="342" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--c5:#e7eef6">
<title id="title">Choose exactly one file backend</title>
<desc id="desc">For a virtual file path, choose the longest matching prefix. A match selects the routed backend and strips the prefix. No match selects the default backend with the original path. The branches are exclusive alternatives.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="32" y="16" width="256" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="48" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Longest prefix?</text>
<text x="160" y="74" text-anchor="middle" fill="var(--muted)" font-size="18">Choose exactly one</text>
<line x1="160" y1="92" x2="160" y2="162" stroke="var(--border)" stroke-width="2"/>
<path class="flow" d="M160 162 H74 V206" fill="none" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<path class="flow" d="M160 162 H246 V206" fill="none" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<text x="74" y="147" text-anchor="middle" fill="var(--fg)" font-size="18">Match</text>
<text x="246" y="147" text-anchor="middle" fill="var(--fg)" font-size="18">No match</text>
<rect x="8" y="206" width="132" height="120" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="74" y="234" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Matched</text>
<text x="74" y="257" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">backend</text>
<text x="74" y="285" text-anchor="middle" fill="var(--muted)" font-size="18">Strip</text>
<text x="74" y="308" text-anchor="middle" fill="var(--muted)" font-size="18">prefix</text>
<rect x="180" y="206" width="132" height="120" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="246" y="234" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Default</text>
<text x="246" y="257" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">backend</text>
<text x="246" y="285" text-anchor="middle" fill="var(--muted)" font-size="18">Original</text>
<text x="246" y="308" text-anchor="middle" fill="var(--muted)" font-size="18">path</text>
</g></svg>
