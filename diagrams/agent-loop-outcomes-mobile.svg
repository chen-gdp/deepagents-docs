<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 528" width="320" height="528" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--c5:#e7eef6">
<title id="title">Invocation outcomes are not task correctness</title>
<desc id="desc">A non-directional comparison, not an execution graph or exact compiled topology. Completed invocation means control flow reached END, not that the task is correct. Paused or resumable means an interrupt, not END; a checkpoint enables resumption. Failed or cancelled means an exception or cancellation rather than normal completion. None of these outcomes implies rollback of side effects.</desc>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="var(--fg)">
<rect x="8" y="16" width="304" height="140" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="55" text-anchor="middle" font-size="22" font-weight="700">Completed invocation</text>
<text x="160" y="94" text-anchor="middle" font-size="20">Reached END</text>
<text x="160" y="127" text-anchor="middle" font-size="18">Not proof of correctness</text>
<rect x="8" y="172" width="304" height="140" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="211" text-anchor="middle" font-size="22" font-weight="700">Paused / resumable</text>
<text x="160" y="250" text-anchor="middle" font-size="20">Interrupt is not END</text>
<text x="160" y="283" text-anchor="middle" font-size="18">Resume from a checkpoint</text>
<rect x="8" y="328" width="304" height="140" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="367" text-anchor="middle" font-size="22" font-weight="700">Failed / cancelled</text>
<text x="160" y="406" text-anchor="middle" font-size="20">Exception / cancellation</text>
<text x="160" y="439" text-anchor="middle" font-size="18">Not normal completion</text>
<text x="160" y="508" text-anchor="middle" font-size="20" fill="var(--muted)">Side effects may remain.</text>
</g></svg>
