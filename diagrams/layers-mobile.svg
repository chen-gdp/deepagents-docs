<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 414" width="320" height="414" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--c5:#e7eef6">
<title id="title">Three layers, one runtime</title>
<desc id="desc">Deep Agents configures LangChain create_agent. LangChain builds the model and tool graph. LangGraph executes that graph and owns state, checkpoints and streams. These are layers, not separate services.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="16" width="280" height="96" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="46" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Deep Agents</text>
<text x="160" y="71" text-anchor="middle" fill="var(--muted)" font-size="18">Tools · context</text>
<text x="160" y="96" text-anchor="middle" fill="var(--muted)" font-size="18">Delegation · policies</text>
<line x1="160" y1="112" x2="160" y2="159" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="159" width="280" height="96" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="189" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">LangChain</text>
<text x="160" y="214" text-anchor="middle" fill="var(--muted)" font-size="18">create_agent</text>
<text x="160" y="239" text-anchor="middle" fill="var(--muted)" font-size="18">Build model/tool graph</text>
<line x1="160" y1="255" x2="160" y2="302" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="302" width="280" height="96" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="332" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">LangGraph</text>
<text x="160" y="357" text-anchor="middle" fill="var(--muted)" font-size="18">State · checkpoints</text>
<text x="160" y="382" text-anchor="middle" fill="var(--muted)" font-size="18">Streams · execution</text>
</g></svg>
