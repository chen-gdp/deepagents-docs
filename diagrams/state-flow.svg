<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--surface:#fff;--accent:#40b4e5;--c5:#e7eef6" viewBox="0 0 760 395" width="760" height="395">
<title id="title">State is read, projected, and reduced</title><desc id="desc">Read clockwise: graph state is projected into a model request. Model and tool work produce state writes. Reducers merge those writes into the next state. Token streams are observations, not canonical message writes.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="30" y="25" width="300" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="180" y="69" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="700">Graph state</text>
<text x="180" y="107" text-anchor="middle" fill="var(--muted)" font-size="23">Messages · files</text>
<rect x="430" y="25" width="300" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="580" y="69" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="700">Model request</text>
<text x="580" y="107" text-anchor="middle" fill="var(--muted)" font-size="23">Projected context</text>
<rect x="430" y="255" width="300" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="580" y="299" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="700">Model / tool step</text>
<text x="580" y="337" text-anchor="middle" fill="var(--muted)" font-size="23">Decisions · results</text>
<rect x="30" y="255" width="300" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="180" y="299" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="700">State reducers</text>
<text x="180" y="337" text-anchor="middle" fill="var(--muted)" font-size="23">Merge state writes</text>
<line x1="330" y1="80" x2="430" y2="80" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="580" y1="135" x2="580" y2="255" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="430" y1="310" x2="330" y2="310" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="255" x2="180" y2="135" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
