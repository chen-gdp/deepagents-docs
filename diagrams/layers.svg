<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" width="660" height="490" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--surface:#fff;--accent:#40b4e5;--c5:#e7eef6">
<title id="title">Three layers, one agent runtime</title><desc id="desc">Deep Agents configures LangChain create_agent, which builds an agent graph executed by LangGraph. These are layers, not three separate services.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="40" y="25" width="580" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="69" text-anchor="middle" fill="var(--fg)" font-size="30" font-weight="700">Deep Agents</text>
<text x="330" y="107" text-anchor="middle" fill="var(--muted)" font-size="26">Tools · context · delegation</text>
<line x1="330" y1="135" x2="330" y2="190" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="190" width="580" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="234" text-anchor="middle" fill="var(--fg)" font-size="30" font-weight="700">LangChain create_agent</text>
<text x="330" y="272" text-anchor="middle" fill="var(--muted)" font-size="26">Model + tools → agent graph</text>
<line x1="330" y1="300" x2="330" y2="355" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="355" width="580" height="110" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="399" text-anchor="middle" fill="var(--fg)" font-size="30" font-weight="700">LangGraph</text>
<text x="330" y="437" text-anchor="middle" fill="var(--muted)" font-size="26">State · checkpoints · streams</text>
</g></svg>
