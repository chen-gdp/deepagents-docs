<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450" width="320" height="450" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--c5:#e7eef6">
<title id="title">State through one iteration</title>
<desc id="desc">Follow the main arrows downward: graph state becomes a projected model request; model and tool work produce writes; reducers merge them. The left return arrow starts the next iteration. This is conceptual data flow, not literal graph topology.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="44" y="16" width="252" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="170" y="48" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Graph state</text>
<text x="170" y="74" text-anchor="middle" fill="var(--muted)" font-size="18">Messages · files</text>
<line x1="170" y1="92" x2="170" y2="130" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="130" width="252" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="170" y="162" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Model request</text>
<text x="170" y="188" text-anchor="middle" fill="var(--muted)" font-size="18">Projected context</text>
<line x1="170" y1="206" x2="170" y2="244" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="244" width="252" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="170" y="276" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Model / tool step</text>
<text x="170" y="302" text-anchor="middle" fill="var(--muted)" font-size="18">Decisions · results</text>
<line x1="170" y1="320" x2="170" y2="358" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="358" width="252" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="170" y="390" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">State reducers</text>
<text x="170" y="416" text-anchor="middle" fill="var(--muted)" font-size="18">Merge state writes</text>
<path class="flow secondary" d="M44 396 H12 V54 H44" fill="none" stroke="var(--muted)" stroke-width="1.5" opacity="0.55" marker-end="url(#arrow)"/>
</g></svg>
