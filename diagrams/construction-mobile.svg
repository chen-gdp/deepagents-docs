<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 414" width="320" height="414" role="img" aria-labelledby="title desc" style="--fg:#004987;--muted:#003a5c;--border:#005cb8;--c5:#e7eef6">
<title id="title">Construction happens before invocation</title>
<desc id="desc">Resolve model, profile and backend; prepare prompts, tools and middleware stacks; build the LangChain graph; return a runnable for later invocation or streaming.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--border)"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="16" width="280" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="48" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Resolve configuration</text>
<text x="160" y="74" text-anchor="middle" fill="var(--muted)" font-size="18">Model · profile · backend</text>
<line x1="160" y1="92" x2="160" y2="118" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="118" width="280" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="150" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Prepare stacks</text>
<text x="160" y="176" text-anchor="middle" fill="var(--muted)" font-size="18">Tools · prompts · rules</text>
<line x1="160" y1="194" x2="160" y2="220" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="220" width="280" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="252" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Build graph</text>
<text x="160" y="278" text-anchor="middle" fill="var(--muted)" font-size="18">LangChain create_agent</text>
<line x1="160" y1="296" x2="160" y2="322" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="322" width="280" height="76" rx="12" fill="var(--c5)" stroke="var(--border)" stroke-width="1.5"/>
<text x="160" y="354" text-anchor="middle" fill="var(--fg)" font-size="20" font-weight="700">Return runnable</text>
<text x="160" y="380" text-anchor="middle" fill="var(--muted)" font-size="18">Invoke or stream later</text>
</g></svg>
